/* ===== Geometry helpers: ellipse, rounded rect, circle ===== */
function ellipsePts(cx, cy, rx, ry, n = 64) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
function rrectPts(x, y, w, h, r, n = 12) {
  r = Math.min(r, w / 2, h / 2);
  const pts = [];
  const P = Math.PI;
  pts.push([x + r, y + h], [x + w - r, y + h]);
  for (let i = 0; i <= n; i++) {
    const a = P / 2 - i / n * P / 2;
    pts.push([x + w - r + r * Math.cos(a), y + h - r + r * Math.sin(a)]);
  }
  pts.push([x + w, y + r]);
  for (let i = 0; i <= n; i++) {
    const a = -i / n * P / 2;
    pts.push([x + w - r + r * Math.cos(a), y + r + r * Math.sin(a)]);
  }
  pts.push([x + r, y]);
  for (let i = 0; i <= n; i++) {
    const a = -P / 2 - i / n * P / 2;
    pts.push([x + r + r * Math.cos(a), y + r + r * Math.sin(a)]);
  }
  pts.push([x, y + h - r]);
  for (let i = 0; i <= n; i++) {
    const a = P - i / n * P / 2;
    pts.push([x + r + r * Math.cos(a), y + h - r + r * Math.sin(a)]);
  }
  pts.push(pts[0].slice());
  return pts;
}

/* Thẻ treo hang tag */
function hangTag({
  L,
  W,
  cr,
  holeD,
  holeY
}) {
  const P = [];
  P.push(new Path(rrectPts(-L / 2, -W / 2, L, W, cr), 'cut'));
  if (holeD > 0) {
    P.push(new Path(ellipsePts(0, -W / 2 + holeY, holeD / 2, holeD / 2, 32), 'cut'));
  }
  return P;
}
function hangTagFold({
  L,
  W,
  cr,
  holeD,
  holeY
}) {
  const P = [];
  const hW = W / 2;
  P.push(new Path(rrectPts(-L / 2, -hW, L, W * 2, cr), 'cut'));
  P.push(new Path([[-L / 2, hW], [L / 2, hW]], 'crease')); // fold line
  if (holeD > 0) {
    P.push(new Path(ellipsePts(0, -hW + holeY, holeD / 2, holeD / 2, 32), 'cut'));
    P.push(new Path(ellipsePts(0, hW + (W - holeY), holeD / 2, holeD / 2, 32), 'cut'));
  }
  return P;
}

/* Túi giấy — y-up: đáy=y nhỏ, nắp=y lớn */
function tuiGiay2Manh({
  W,
  H,
  G,
  HTop: ht,
  HBot: hb,
  Glue: gl,
  HR: hr,
  HOX: hox,
  HGAP: hgap
}) {
  const P = [],
    hG = G / 2,
    tW = G + W + G + W + gl,
    tH = ht + H + hb;
  const C = a => P.push(new Path(a, 'crease')),
    U = a => P.push(new Path(a, 'cut'));

    x2 = G + W,
    x3 = 2 * G + W,
    x4 = 2 * G + 2 * W;
  const yDay = hb,
    yNap = hb + H,
    yMid = hb + hG;
  const midL = hG,
    midM = G + W + hG;
  // full rectangle boundary
  U([[0, 0], [tW, 0]]);
  U([[tW, 0], [tW, tH]]);
  U([[tW, tH], [0, tH]]);
  U([[0, tH], [0, 0]]);
  U([[0, yNap], [tW, yNap]]);
  U([[0, yDay], [tW, yDay]]);
  U([[x1, 0], [x1, tH]]);
  U([[x2, 0], [x2, tH]]);
  U([[x3, 0], [x3, tH]]);
  U([[x4, 0], [x4, tH]]);

  C([[x1 + hb, 0], [midL, yMid]]);
  C([[midL, yMid], [0, yDay]]);

    const r = hr / 2;
    for (const [px, pw] of [[x1, W], [x3, W]]) {
      const cx1 = px + pw / 2 - hox,
        cx2 = px + pw / 2 + hox;
      P.push(new Path(ellipsePts(cx1, yNap + hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx2, yNap + hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx1, yNap - hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx2, yNap - hgap, r, r, 32), 'cut'));
