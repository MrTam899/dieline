/* ===== Geometry helpers: ellipse, rounded rect, circle ===== */
function ellipsePts(cx, cy, rx, ry, n = 64) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
function rrectPts(x, y, w, h, r, n = 12) {
  r = Math.min(r, w / 2, h / 2);
  const pts = [];
  const P = Math.PI;
  pts.push([x + r, y + h], [x + w - r, y + h]);
  for (let i = 0; i <= n; i++) {
    const a = P / 2 - i / n * P / 2;
    pts.push([x + w - r + r * Math.cos(a), y + h - r + r * Math.sin(a)]);
  }
  pts.push([x + w, y + r]);
  for (let i = 0; i <= n; i++) {
    const a = -i / n * P / 2;
    pts.push([x + w - r + r * Math.cos(a), y + r + r * Math.sin(a)]);
  }
  pts.push([x + r, y]);
  for (let i = 0; i <= n; i++) {
    const a = -P / 2 - i / n * P / 2;
    pts.push([x + r + r * Math.cos(a), y + r + r * Math.sin(a)]);
  }
  pts.push([x, y + h - r]);
  for (let i = 0; i <= n; i++) {
    const a = P - i / n * P / 2;
    pts.push([x + r + r * Math.cos(a), y + h - r + r * Math.sin(a)]);
  }
  pts.push(pts[0].slice());
  return pts;
}

/* Thẻ treo hang tag */
function hangTag({
  L,
  W,
  cr,
  holeD,
  holeY
}) {
  const P = [];
  P.push(new Path(rrectPts(-L / 2, -W / 2, L, W, cr), 'cut'));
  if (holeD > 0) {
    P.push(new Path(ellipsePts(0, -W / 2 + holeY, holeD / 2, holeD / 2, 32), 'cut'));
  }
  return P;
}
function hangTagFold({
  L,
  W,
  cr,
  holeD,
  holeY
}) {
  const P = [];
  const hW = W / 2;
  P.push(new Path(rrectPts(-L / 2, -hW, L, W * 2, cr), 'cut'));
  P.push(new Path([[-L / 2, hW], [L / 2, hW]], 'crease')); // fold line
  if (holeD > 0) {
    P.push(new Path(ellipsePts(0, -hW + holeY, holeD / 2, holeD / 2, 32), 'cut'));
    P.push(new Path(ellipsePts(0, hW + (W - holeY), holeD / 2, holeD / 2, 32), 'cut'));
  }
  return P;
}

/* Túi giấy — y-up: đáy=y nhỏ, nắp=y lớn */
function tuiGiay2Manh({
  W,
  H,
  G,
  HTop: ht,
  HBot: hb,
  Glue: gl,
  HR: hr,
  HOX: hox,
  HGAP: hgap
}) {
  const P = [],
    hG = G / 2,
    tW = G + W + G + W + gl,
    tH = ht + H + hb;
  const C = a => P.push(new Path(a, 'crease')),
    U = a => P.push(new Path(a, 'cut'));
  const x1 = G,
    x2 = G + W,
    x3 = 2 * G + W,
    x4 = 2 * G + 2 * W;
  const yDay = hb,
    yNap = hb + H,
    yMid = hb + hG;
  const midL = hG,
    midM = G + W + hG;
  // full rectangle boundary
  U([[0, 0], [tW, 0]]);
  U([[tW, 0], [tW, tH]]);
  U([[tW, tH], [0, tH]]);
  U([[0, tH], [0, 0]]);
  U([[0, yNap], [tW, yNap]]);
  U([[0, yDay], [tW, yDay]]);
  U([[x1, 0], [x1, tH]]);
  U([[x2, 0], [x2, tH]]);
  U([[x3, 0], [x3, tH]]);
  U([[x4, 0], [x4, tH]]);
  // folds — đáy tam giác ở DƯỚI (y nhỏ)
  C([[midL, yNap], [midL, 0]]);
  C([[midM, yNap], [midM, 0]]);
  C([[midM, yMid], [midL, yMid]]);
  C([[tW, G], [x4 - hb, 0]]);
  C([[x3 + hb, 0], [midM, yMid]]);
  C([[midM, yMid], [x2 - hb, 0]]);
  C([[x1 + hb, 0], [midL, yMid]]);
  C([[midL, yMid], [0, yDay]]);
  // lỗ quai ở TRÊN (y lớn, gần nắp)
  if (hr > 0) {
    const r = hr / 2;
    for (const [px, pw] of [[x1, W], [x3, W]]) {
      const cx1 = px + pw / 2 - hox,
        cx2 = px + pw / 2 + hox;
      P.push(new Path(ellipsePts(cx1, yNap + hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx2, yNap + hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx1, yNap - hgap, r, r, 32), 'cut'));
      P.push(new Path(ellipsePts(cx2, yNap - hgap, r, r, 32), 'cut'));
    }
  }
  return P;
}

function safeLoad(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_) {
    return fallback;
  }
}
function safeSave(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
}
function safeFilePart(v) {
  return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 60);
}


function makeReportPreviewSvgData(svgEl) {
  if (!svgEl) return '';
  try {
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', '1000');
    clone.setAttribute('height', '1000');

    // Make the preview suitable for a white production sheet.
    const paperRect = clone.querySelector('rect');
    if (paperRect) {
      paperRect.setAttribute('fill', '#ffffff');
      paperRect.setAttribute('stroke', '#94a3b8');
    }
    // Remove translucent grip fill; keep its boundary if present.
    const rects = clone.querySelectorAll('rect');
    if (rects.length > 1) {
      rects.forEach((r, i) => {
        if (i > 0 && String(r.getAttribute('fill') || '').includes('dc2626')) {
          r.setAttribute('fill', 'none');
          r.setAttribute('stroke', '#ef4444');
          r.setAttribute('stroke-dasharray', '4,3');
        }
      });
    }
    // Remove screen-only tiny annotation text.
    clone.querySelectorAll('text').forEach(t => t.remove());

    const xml = new XMLSerializer().serializeToString(clone);
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  } catch (e) {
    console.warn('Không tạo được hình bình cho Phiếu sản xuất:', e);
    return '';
  }
}

  const soleKnifeCheck = useMemo(
    () => checkKnifeItems(sole.items, gap),
    [checkKnifeItems, sole.items, gap]
  );

  const saving = sole.count - imp.count;
  const minPct = sole.minP;
  const clampedPct = sole.pct;
  // V6.6.1 — True paper efficiency:
  // actual dieline blank area × number of blanks / sheet area.
  // If the same number of blanks remains on the same sheet, changing nesting step
  // must not artificially change paper efficiency.
  const soleYieldRaw = paper.w > 0 && paper.h > 0
    ? sole.count * blankAreaSafe / (paper.w * paper.h) * 100
    : 0;
  const impYieldRaw = paper.w > 0 && paper.h > 0
    ? imp.count * blankAreaSafe / (paper.w * paper.h) * 100
    : 0;
  const soleYield = Math.max(0, Math.min(100, soleYieldRaw)).toFixed(1);
  const impYield = Math.max(0, Math.min(100, impYieldRaw)).toFixed(1);

  // V6.2 — Real production comparison: Sole vs normal imposition on the same sheet.
  const normalSheetsForCompare = imp.count > 0 && qty > 0 ? Math.ceil(qty / imp.count) : 0;
  const soleSheetsForCompare = sole.count > 0 && qty > 0 ? Math.ceil(qty / sole.count) : 0;
  const soleSheetSaving = normalSheetsForCompare > 0 && soleSheetsForCompare > 0
    ? normalSheetsForCompare - soleSheetsForCompare : 0;
  const normalPaperArea = normalSheetsForCompare * paper.w * paper.h;
  const solePaperArea = soleSheetsForCompare * paper.w * paper.h;
  const solePaperSavingPct = normalPaperArea > 0
    ? Math.max(0, (normalPaperArea - solePaperArea) / normalPaperArea * 100) : 0;
  const soleYieldGainPts = +(parseFloat(soleYield) - parseFloat(impYield)).toFixed(1);

  const impWaste = (100 - parseFloat(impYield)).toFixed(1);
  const impUsableYield = Math.min(100, imp.count * blankAreaSafe / (Math.max(1, (paper.w - grip) * paper.h)) * 100).toFixed(1);

  // V6.1 — Compare all standard paper sizes by material efficiency.
  // Ranking metric: highest die-area / paper-area utilization; tie-break by more ups.
  const paperSuggestions = useMemo(() => {
    return PAPERS.map((pp, idx) => {
      const lay = calcImp(dW, dH, pp.w, pp.h, gap, grip, 'auto');
      const yld = lay.count > 0 ? Math.min(100, lay.count * blankAreaSafe / (pp.w * pp.h) * 100) : 0;
      const sheets = lay.count > 0 && qty > 0 ? Math.ceil(qty / lay.count) : 0;
      const totalArea = sheets > 0 ? sheets * pp.w * pp.h : 0;
      return {
        idx, name: pp.name, w: pp.w, h: pp.h,
        count: lay.count, rotated: lay.rotated,
        cols: lay.cols, rows: lay.rows,
        yieldPct: yld,
        sheets, totalArea
      };
    }).filter(x => x.count > 0).sort((a, b) =>
      b.count - a.count ||
      a.sheets - b.sheets ||
      a.totalArea - b.totalArea ||
      b.yieldPct - a.yieldPct ||
      a.w * a.h - b.w * b.h
    ).slice(0, 3);
  }, [dW, dH, gap, grip, qty, blankAreaSafe]);

  // V6.9 — Safety-aware Auto Production Optimizer.
  // Priority: feasible production only -> fewest sheets -> least total paper area -> higher paper efficiency.
  const autoProductionOptions = useMemo(() => {
    const opts = [];

    const add = (pp, idx, mode, count, rotated, extra = {}) => {
      if (!(count > 0)) return;
      const sheets = qty > 0 ? Math.ceil(qty / count) : 0;
      const area = sheets > 0 ? sheets * pp.w * pp.h : pp.w * pp.h / count;
      const yld = Math.min(100, count * blankAreaSafe / (pp.w * pp.h) * 100);
      opts.push({
        idx, paper: pp, mode, count, rotated: !!rotated,
        sheets, area, yieldPct: yld,
        feasible: extra.feasible !== false,
        ...extra
      });
    };

    const buildSoleCandidate = (pp, strategy) => {
      if (isLabel) {
        const lw = type === 'tem_tron' ? L : L;
        const lh = type === 'tem_tron' ? L : type === 'tem_vuong' ? L : W;
        const a = calcHex(lw, lh, pp.w, pp.h, gapH, gapV, grip);
        const b = calcHex(lh, lw, pp.w, pp.h, gapH, gapV, grip);
        const best = a.count >= b.count ? a : b;
        return {
          count: best.count,
          items: best.items || [],
          strategy: 'hex',
          knife: { checked: false, minDist: null, ok: true, pair: null },
          feasible: grip >= 0
        };
      }

      const aw = pp.w - grip;

      const h = (cw, ch, minP, rotBase) => {
        const pct = Math.max(85, minP);
        const step = Math.round(ch * pct / 100);
        const cols = Math.floor((aw + gap) / (cw + gap));
        const rows = Math.floor((pp.h + gap) / (step + gap));
        const items = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            items.push({
              x: grip + c * (cw + gap),
              y: r * (step + gap),
              w: cw, h: ch,
              rot: r % 2 ? 180 : 0,
              rotBase
            });
          }
        }
        return { count: items.length, items, pct, strategy: 'h180' };
      };

      const v = (cw, ch, minP, rotBase) => {
        const pct = Math.max(85, minP);
        const step = Math.round(cw * pct / 100);
        const cols = Math.floor((aw + gap) / (step + gap));
        const rows = Math.floor((pp.h + gap) / (ch + gap));
        const items = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            items.push({
              x: grip + c * (step + gap),
              y: r * (ch + gap),
              w: cw, h: ch,
              rot: c % 2 ? 180 : 0,
              rotBase
            });
          }
        }
        return { count: items.length, items, pct, strategy: 'v180' };
      };

      const r90 = (cw, ch) => {
        const pW = cw + gap + ch;
        const pairs = Math.floor((aw + gap) / (pW + gap));
        const rN = Math.floor((pp.h + gap) / (ch + gap));
        const rR = Math.floor((pp.h + gap) / (cw + gap));
        const items = [];
        let cx = grip;
        for (let i = 0; i < pairs; i++) {
          for (let r = 0; r < rN; r++) items.push({x:cx,y:r*(ch+gap),w:cw,h:ch,rot:0,rotBase:false});
          cx += cw + gap;
          for (let r = 0; r < rR; r++) items.push({x:cx,y:r*(cw+gap),w:ch,h:cw,rot:90,rotBase:false});
          cx += ch + gap;
        }
        if (cx + cw <= pp.w) {
          for (let r = 0; r < rN; r++) items.push({x:cx,y:r*(ch+gap),w:cw,h:ch,rot:0,rotBase:false});
        }
        return { count: items.length, items, pct: 100, strategy: 'r90' };
      };

      let candidates = [];
      if (strategy === 'h180') {
        candidates = [h(dW, dH, soleProfile.nY, false), h(dH, dW, soleProfile.rY, true)];
      } else if (strategy === 'v180') {
        candidates = [v(dW, dH, soleProfile.nX, false), v(dH, dW, soleProfile.rX, true)];
      } else {
        candidates = [r90(dW, dH), r90(dH, dW)];
      }

      // Check real CUT clearance for every orientation candidate, then choose the best feasible one.
      const checked = candidates.map(c => {
        const knife = checkKnifeItems(c.items, gap);
        const gripOK = grip >= 5;
        return {
          ...c,
          knife,
          gripOK,
          feasible: knife.ok && gripOK
        };
      });

      checked.sort((a, b) =>
        Number(b.feasible) - Number(a.feasible) ||
        b.count - a.count ||
        (b.knife.minDist || 0) - (a.knife.minDist || 0)
      );
      return checked[0];
    };

    PAPERS.forEach((pp, idx) => {
      const n = calcImp(dW, dH, pp.w, pp.h, gap, grip, 'auto');
      add(pp, idx, 'normal', n.count, n.rotated, {
        feasible: grip >= 5 && gap >= 0,
        safetyText: grip >= 5 ? 'Đạt mép bắt nhíp' : 'Mép bắt nhíp quá nhỏ'
      });

      if (isLabel) {
        const c = buildSoleCandidate(pp, 'hex');
        add(pp, idx, 'sole', c.count, false, {
          strategy: 'hex',
          feasible: c.feasible,
          knifeMin: null,
          pct: 100,
          safetyText: c.feasible ? 'Đạt' : 'Cần kiểm tra'
        });
      } else {
        ['h180', 'v180', 'r90'].forEach(strategy => {
          const c = buildSoleCandidate(pp, strategy);
          add(pp, idx, 'sole', c.count, false, {
            strategy,
            feasible: c.feasible,
            knifeMin: c.knife && c.knife.checked ? c.knife.minDist : null,
            pct: c.pct,
            gripOK: c.gripOK,
            safetyText: !c.gripOK
              ? 'Mép bắt nhíp < 5 mm'
              : c.knife && c.knife.checked
                ? (c.knife.ok ? `Dao ${c.knife.minDist.toFixed(1)} mm · Đạt` : `Dao ${c.knife.minDist.toFixed(1)} mm · Không đạt`)
                : 'Chưa cần đo dao'
          });
        });
      }
    });

    opts.sort((a, b) =>
      Number(b.feasible) - Number(a.feasible) ||
      (qty > 0 ? a.sheets - b.sheets : 0) ||
      a.area - b.area ||
      b.yieldPct - a.yieldPct ||
      b.count - a.count
    );

    return opts;
  }, [dW,dH,gap,grip,qty,isLabel,type,L,W,gapH,gapV,soleProfile,blankAreaSafe,checkKnifeItems]);

  const autoBest = autoProductionOptions[0] || null;

  // V6.11 — Production Decision Engine.
  // Prefer options that are feasible and provide a real production advantage.
  const normalBaseline = autoProductionOptions.find(o => o.mode === 'normal' && o.idx === paperIdx)
    || autoProductionOptions.find(o => o.mode === 'normal')
    || null;

  const scoredDecisionOptions = autoProductionOptions.map((op, originalRank) => {
    const baseSheets = normalBaseline && normalBaseline.sheets > 0 ? normalBaseline.sheets : 0;
    const sheetSaving = baseSheets > 0 && op.sheets > 0 ? baseSheets - op.sheets : 0;
    const sheetSavingPct = baseSheets > 0 ? sheetSaving / baseSheets * 100 : 0;
    const countGain = normalBaseline ? op.count - normalBaseline.count : 0;

    let decisionLabel = 'PHƯƠNG ÁN THAM KHẢO';
    let decisionClass = 'text-zinc-400';

    if (op === autoBest && op.feasible) {
      decisionLabel = 'KHUYẾN NGHỊ SẢN XUẤT';
      decisionClass = 'text-emerald-300';
    } else if (op.feasible && (sheetSaving > 0 || countGain > 0)) {
      decisionLabel = 'PHƯƠNG ÁN DỰ PHÒNG';
      decisionClass = 'text-cyan-300';
    } else if (op.feasible && op.mode === 'normal') {
      decisionLabel = 'PHƯƠNG ÁN TIÊU CHUẨN';
      decisionClass = 'text-blue-300';
    } else if (op.feasible) {
      decisionLabel = 'ÍT LỢI ÍCH';
      decisionClass = 'text-amber-300';
    } else {
      decisionLabel = 'KHÔNG KHUYẾN NGHỊ';
      decisionClass = 'text-red-400';
    }

    // Decision score is only for choosing which alternatives to display.
    // Core optimizer ranking remains unchanged.
    let decisionScore = 0;
    if (op.feasible) decisionScore += 100000;
    if (op === autoBest) decisionScore += 50000;
    if (sheetSaving > 0) decisionScore += sheetSaving * 100;
    if (countGain > 0) decisionScore += countGain * 1000;
    if (op.mode === 'normal') decisionScore += 150;
    if (op.mode === 'sole' && sheetSaving <= 0 && countGain <= 0) decisionScore -= 3000;
    decisionScore += Math.max(0, 1000 - originalRank);

    return {
      ...op,
      sheetSaving,
      sheetSavingPct,
      countGain,
      decisionLabel,
      decisionClass,
      decisionScore
    };
  });

  const autoTop3 = scoredDecisionOptions
    .slice()
    .sort((a, b) => b.decisionScore - a.decisionScore)
    .slice(0, 3);

  // V6.12 — Cost & Paper Intelligence.
  const calcPaperCost = useCallback((op) => {
    if (!op || !(op.sheets > 0) || !(paperPrice > 0)) return 0;
    if (costMode === 'sheet') return op.sheets * paperPrice;
    const areaM2 = (op.paper.w / 1000) * (op.paper.h / 1000);
    const kgPerSheet = areaM2 * Math.max(0, paperGsm) / 1000;
    return op.sheets * kgPerSheet * paperPrice;
  }, [costMode, paperGsm, paperPrice]);

  const normalPaperCost = calcPaperCost(normalBaseline);
  const bestPaperCost = calcPaperCost(autoBest);
  const paperCostSaving = Math.max(0, normalPaperCost - bestPaperCost);
  const paperCostSavingPct = normalPaperCost > 0 ? paperCostSaving / normalPaperCost * 100 : 0;
  const fmtMoney = v => `${Math.round(Number(v) || 0).toLocaleString('vi-VN')} đ`;

  const paperKgForOption = op => {
    if (!op || !(op.sheets > 0)) return 0;
    const areaM2 = (op.paper.w / 1000) * (op.paper.h / 1000);
    return op.sheets * areaM2 * Math.max(0, paperGsm) / 1000;
  };

  const autoTop3Costed = autoTop3.map(op => ({
    ...op,
    estimatedPaperCost: calcPaperCost(op),
    estimatedPaperKg: paperKgForOption(op)
  }));

  // V6.13 — Full production cost estimate.
  const calcProductionCost = useCallback((op) => {
    if (!op || !(op.sheets > 0)) {
      return { paper:0, print:0, lamination:0, diecut:0, gluing:0, other:0, total:0, unit:0 };
    }
    const sheetAreaM2 = (op.paper.w / 1000) * (op.paper.h / 1000);
    const paper = calcPaperCost(op);
    const print = op.sheets * Math.max(0, printCostSheet);
    const lamination = op.sheets * sheetAreaM2 * Math.max(0, lamCostM2);
    const diecut = op.sheets * Math.max(0, dieCostSheet);
    const gluing = Math.max(0, qty) * Math.max(0, glueCostPiece);
    const other = Math.max(0, otherJobCost);
    const total = paper + print + lamination + diecut + gluing + other;
    const unit = qty > 0 ? total / qty : 0;
    return { paper, print, lamination, diecut, gluing, other, total, unit };
  }, [calcPaperCost, printCostSheet, lamCostM2, dieCostSheet, glueCostPiece, otherJobCost, qty]);

  const normalProductionCost = calcProductionCost(normalBaseline);
  const bestProductionCost = calcProductionCost(autoBest);
  const productionCostSaving = Math.max(0, normalProductionCost.total - bestProductionCost.total);
  const productionCostSavingPct = normalProductionCost.total > 0
    ? productionCostSaving / normalProductionCost.total * 100
    : 0;
  const hasProductionCostInput =
    paperPrice > 0 || printCostSheet > 0 || lamCostM2 > 0 ||
    dieCostSheet > 0 || glueCostPiece > 0 || otherJobCost > 0;

  // V6.16 — Production Cost Audit.
  // Independent checks to make costing auditable before quotation use.
  const auditProductionOption = useCallback((op) => {
    if (!op || !(op.count > 0)) {
      return { ok:false, checks:[], expectedSheets:0, actualOutput:0, overrun:0 };
    }

    const expectedSheets = qty > 0 ? Math.ceil(qty / op.count) : 0;
    const actualOutput = expectedSheets * op.count;
    const overrun = qty > 0 ? Math.max(0, actualOutput - qty) : 0;
    const c = calcProductionCost(op);

    const sheetMathOK = op.sheets === expectedSheets;
    const outputOK = qty <= 0 || actualOutput >= qty;
    const nonNegativeOK = [
      c.paper, c.print, c.lamination, c.diecut, c.gluing, c.other, c.total, c.unit
    ].every(v => Number.isFinite(v) && v >= 0);

    const sumParts = c.paper + c.print + c.lamination + c.diecut + c.gluing + c.other;
    const sumOK = Math.abs(sumParts - c.total) < 0.5;

    // Unit cost is intentionally based on requested quantity, not overrun/output quantity.
    const unitExpected = qty > 0 ? c.total / qty : 0;
    const unitOK = qty <= 0 || Math.abs(unitExpected - c.unit) < 0.01;

    const checks = [
      { name:'Số tờ làm tròn lên', ok:sheetMathOK, detail:`${expectedSheets.toLocaleString('vi-VN')} tờ` },
      { name:'Sản lượng đủ đơn hàng', ok:outputOK, detail: qty > 0 ? `${actualOutput.toLocaleString('vi-VN')} SP · dư ${overrun.toLocaleString('vi-VN')}` : 'Chưa nhập số lượng' },
      { name:'Cộng đủ các công đoạn', ok:sumOK, detail:fmtMoney(c.total) },
      { name:'Giá/SP theo SL đặt hàng', ok:unitOK, detail:qty > 0 ? fmtMoney(c.unit) : '—' },
      { name:'Không có chi phí âm/lỗi', ok:nonNegativeOK, detail:nonNegativeOK ? 'Hợp lệ' : 'Cần kiểm tra' }
    ];

    return {
      ok: checks.every(x => x.ok),
      checks,
      expectedSheets,
      actualOutput,
      overrun,
      cost:c
    };
  }, [qty, calcProductionCost]);

  const normalCostAudit = auditProductionOption(normalBaseline);
  const bestCostAudit = auditProductionOption(autoBest);

  const savingAuditOK = (() => {
    if (!normalBaseline || !autoBest) return true;
    const expected = normalProductionCost.total - bestProductionCost.total;
    return Math.abs(expected - (normalProductionCost.total - bestProductionCost.total)) < 0.5;
  })();

  const productionAuditOK =
    normalCostAudit.ok && bestCostAudit.ok && savingAuditOK;



  const applyAutoBest = () => {
    if (!autoBest) return;
    setPI(autoBest.idx);
    if (autoBest.mode === 'normal') {
      setImpMode('auto');
      setTab('imp');
    } else {
      if (autoBest.strategy && autoBest.strategy !== 'hex') setSoleMode(autoBest.strategy);
      if (autoBest.pct != null) setStepPct(Math.round(autoBest.pct));
      else setStepPct(85);
      setTab('sole');
    }
    setZoom(1);
    setPanX(0);
    setPanY(0);
  };
  const currentViewText = tab === 'imp'
    ? `${paper.name} · Bình thường · ${imp.count} con/khổ${qty > 0 && imp.count > 0 ? ` · ${Math.ceil(qty / imp.count).toLocaleString('vi-VN')} tờ` : ''}`
    : tab === 'sole'
      ? `${paper.name} · ${soleMode === 'h180' ? 'Sole 180° hàng' : soleMode === 'v180' ? 'Sole 180° cột' : soleMode === 'r90' ? 'Sole 90° cột' : 'Sole'} · ${sole.count} con/khổ${qty > 0 && sole.count > 0 ? ` · ${Math.ceil(qty / sole.count).toLocaleString('vi-VN')} tờ` : ''}`
      : `${paper.name} · Khuôn`;

  const bestPaperSuggestion = paperSuggestions[0] || null;
  const currentPaperYieldNum = parseFloat(impYield);
  const yieldGain = bestPaperSuggestion ? +(bestPaperSuggestion.yieldPct - currentPaperYieldNum).toFixed(1) : 0;

  const printSheets = imp.count > 0 && qty > 0 ? Math.ceil(qty / imp.count) : 0;
  const printCapacity = printSheets * imp.count;
  const printOver = printSheets > 0 ? printCapacity - qty : 0;
  const productionChecks = [
    { level: imp.count > 0 ? 'ok' : 'error', text: imp.count > 0 ? `Khuôn phù hợp khổ giấy · ${imp.count} con/khổ` : 'Khuôn không nằm vừa khổ giấy hiện tại' },
    { level: gap >= 3 ? 'ok' : gap >= 2 ? 'warn' : 'error', text: `Khoảng cách dao ${gap} mm${gap >= 3 ? ' · Đạt' : gap >= 2 ? ' · Cần kiểm tra' : ' · Quá nhỏ, cần kiểm tra khoảng cách dao'}` },
    { level: grip >= 10 ? 'ok' : grip >= 5 ? 'warn' : 'error', text: `Mép bắt nhíp ${grip} mm${grip >= 10 ? ' · Đạt' : grip >= 5 ? ' · Cần xác nhận theo máy in' : ' · Quá nhỏ'}` },
    ...(qty > 0 && imp.count > 0 ? [{ level: printOver === 0 ? 'ok' : 'info', text: printOver === 0 ? `${Number(qty).toLocaleString('vi-VN')} sản phẩm / ${Number(printSheets).toLocaleString('vi-VN')} tờ in` : `${Number(printSheets).toLocaleString('vi-VN')} tờ in = ${Number(printCapacity).toLocaleString('vi-VN')} sản phẩm · dư ${Number(printOver).toLocaleString('vi-VN')}` }] : [])
  ];
  const hasProductionError = productionChecks.some(x => x.level === 'error');
  const productionReportData = {
    isSole: false,
    jobName, jobCode, productName, reportAuthor, reportRevision, typeName: def.name,
    L, W, H, dW, dH, paperW: paper.w, paperH: paper.h,
    orientation: imp.rotated ? 'XOAY 90 DO' : 'GIU CHIEU',
    cols: imp.cols, rows: imp.rows, count: imp.count,
    qty, sheets: printSheets, capacity: printCapacity, over: printOver,
    yieldPct: impYield, wastePct: impWaste, gap, grip,
    paperGsm,
    statusText: hasProductionError ? 'TRANG THAI: CAN KIEM TRA LAI TRUOC SAN XUAT' : 'TRANG THAI: BINH BAI DAT YEU CAU KIEM TRA CO BAN',
    orientationText: imp.rotated ? 'Xoay 90°' : 'Giữ chiều',
    checks: productionChecks,
    hasError: hasProductionError
  };
  const solePrintSheets = sole.count > 0 && qty > 0 ? Math.ceil(qty / sole.count) : 0;
  const solePrintCapacity = solePrintSheets * sole.count;
  const solePrintOver = solePrintSheets > 0 ? solePrintCapacity - qty : 0;
  const soleWaste = (100 - parseFloat(soleYield)).toFixed(1);
  const soleStrategyText = isLabel
    ? 'Bình tem'
    : soleMode === 'h180'
      ? 'Sole 180° hàng'
      : soleMode === 'v180'
        ? 'Sole 180° cột'
        : soleMode === 'r90'
          ? 'Sole 90° cột'
          : 'Sole';
  const soleChecks = [
    { level: sole.count > 0 ? 'ok' : 'error', text: sole.count > 0 ? `Phương án ${soleStrategyText} · ${sole.count} con/khổ` : 'Phương án Sole không phù hợp khổ giấy hiện tại' },
    ...(soleKnifeCheck.checked ? [{
      level: soleKnifeCheck.ok ? 'ok' : 'error',
      text: soleKnifeCheck.ok
        ? `Khoảng cách dao thực tế nhỏ nhất ${soleKnifeCheck.minDist.toFixed(1)} mm · Đạt`
        : `CẢNH BÁO: Dao cách dao thực tế chỉ ${soleKnifeCheck.minDist.toFixed(1)} mm < yêu cầu ${gap} mm`
    }] : []),
    { level: gap >= 3 ? 'ok' : gap >= 2 ? 'warn' : 'error', text: `Khoảng cách dao cài đặt ${gap} mm${gap >= 3 ? ' · Đạt mức khuyến nghị' : gap >= 2 ? ' · Cần kiểm tra' : ' · Quá nhỏ, cần kiểm tra khoảng cách dao'}` },
    { level: grip >= 10 ? 'ok' : grip >= 5 ? 'warn' : 'error', text: `Mép bắt nhíp ${grip} mm${grip >= 10 ? ' · Đạt' : grip >= 5 ? ' · Cần xác nhận theo máy in' : ' · Quá nhỏ'}` },
    ...(qty > 0 && sole.count > 0 ? [{ level: solePrintOver === 0 ? 'ok' : 'info', text: solePrintOver === 0 ? `${Number(qty).toLocaleString('vi-VN')} sản phẩm / ${Number(solePrintSheets).toLocaleString('vi-VN')} tờ in` : `${Number(solePrintSheets).toLocaleString('vi-VN')} tờ in = ${Number(solePrintCapacity).toLocaleString('vi-VN')} sản phẩm · dư ${Number(solePrintOver).toLocaleString('vi-VN')}` }] : [])
  ];
  const soleHasProductionError = soleChecks.some(x => x.level === 'error');
  const soleProductionReportData = {

  }, [

  const JOB_STATUS = [

  // V6.47 — Approval Snapshot: freeze the approved production data and verify it before production.

    "type","L","W","H","p","z","sx","dustAuto","dustH","qty","paperIdx","cpw","cph",
    "gap","grip","impMode","soleMode","stepPct","paperGsm","costMode","paperPrice",

  ];
  const APPROVAL_SNAPSHOT_LABELS = {
    type:"Loại khuôn",L:"Dài L",W:"Rộng W",H:"Cao H",p:"Đáy P",z:"Lưỡi Z",sx:"Mép dán",

<script>
/* V7.0.4 mobile navigation: page switch is separated from drawing pan. */
(function(){
  function initMobileNav(){
    if(window.innerWidth>900) return;
    var grid=document.querySelector('.app-main-grid');
    if(!grid || document.querySelector('.mobile-page-nav')) return;
    var side=grid.querySelector('.sidebar-panel');
    var drawing=grid.querySelector('.mobile-drawing-page');
    if(!side || !drawing) return;
    var nav=document.createElement('div'); nav.className='mobile-page-nav';
    var b1=document.createElement('button'), b2=document.createElement('button');
    b1.textContent='Thông số'; b2.textContent='Bản vẽ'; b1.className='active';
    nav.appendChild(b1); nav.appendChild(b2); document.body.appendChild(nav);
    function go(page){
      grid.scrollTo({left:page===0?0:grid.clientWidth,behavior:'smooth'});
      b1.classList.toggle('active',page===0); b2.classList.toggle('active',page===1);
    }
    b1.onclick=function(){go(0)}; b2.onclick=function(){go(1)};
    // Horizontal page swipe only from sidebar; drawing keeps all gestures for pan.
    var sx=0,sy=0;
    side.addEventListener('touchstart',function(e){if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
    side.addEventListener('touchend',function(e){
      if(!e.changedTouches.length)return;
      var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(dx<-85 && Math.abs(dx)>Math.abs(dy)*1.6) go(1);
    },{passive:true});
    grid.addEventListener('scroll',function(){
      var page=grid.scrollLeft>grid.clientWidth*.45?1:0;
      b1.classList.toggle('active',page===0); b2.classList.toggle('active',page===1);
    },{passive:true});
    window.__dielineMobileGo=go;
  }
  var tries=0,t=setInterval(function(){initMobileNav();if(document.querySelector('.mobile-page-nav')||++tries>50)clearInterval(t)},120);
  window.addEventListener('resize',function(){if(window.innerWidth<=900)initMobileNav()});
})();
</script>
